run:
  name: u1_seed9
  seed: 9
  device: cuda
  amp: true
  out_dir: out/ckpts/pooltest02_s1_round5_finalconfirm_e120
  variant: U1_uncertainty_seed9_e120
data:
  data_dir: data/processed/2026-01-10_pooltest02_s1
  batch_size: 512
  num_workers: 4
  pin_memory: true
  split:
    train_ratio: 0.7
    val_ratio: 0.15
model:
  name: s1_predictor
  din: 25
  dout: 9
  pred_len: 10
  rnn_hidden: 256
  rnn_layers: 2
  dropout: 0.0
  u_in_idx:
  - 0
  - 1
  - 2
  - 3
  - 4
  - 5
  - 6
  - 7
  y_in_idx:
  - 8
  - 9
  - 10
  - 11
  - 12
  - 13
  - 14
  - 15
  - 16
  use_thruster_as_replacement: true
  use_hydro_feat: true
  blocks:
    thruster_lag:
      enabled: false
      normalize_input: true
      pwm_center: 7.5
      pwm_half_range: 2.5
      deadzone: 0.05
      sat_gain: 2.0
      learn_tau: true
      tau_init: 0.08
      tau_min: 0.01
      per_channel_tau: true
      dt: 0.01
    hydro_ssm:
      enabled: false
      hidden_dim: 64
      lambda_init: 0.85
      act: tanh
      per_dim_lambda: true
    damping:
      enabled: false
      v_start: 6
      v_dim: 3
      mode: simple
      d_init: 0.5
      mlp_hidden: 16
    uncertainty:
      enabled: true
      feat_dim: 128
      hidden: 64
      logvar_min: -10.0
      logvar_max: 6.0
rollout:
  y0_source: x_last_state
  mode: delta_cumsum
loss:
  type: nll_diag
  logvar_clip:
  - -10.0
  - 6.0
optim:
  name: adamw
  lr: 0.001
  weight_decay: 0.0001
  grad_clip: 1.0
  scheduler:
    name: reduce_on_plateau
    factor: 0.5
    patience: 5
    min_lr: 1.0e-05
train:
  epochs: 120
  eval_every: 1
  save_best: true
  save_last: true
  metric: val_loss
  early_stopping:
    patience: 12
    min_delta: 0.0001
