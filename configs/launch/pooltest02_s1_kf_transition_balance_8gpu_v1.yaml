base_train_yaml: configs/train/pooltest02_s1_kf_transition_balance_base.yaml

launcher:
  work_dir: out/train_matrix/pooltest02_s1_kf_transition_balance_8gpu_v1
  gpus: [0, 1, 2, 3, 4, 5, 6, 7]
  max_parallel: 8
  run_eval: true
  eval_split: test
  eval_device: cuda
  eval_batch_size: 1024
  plots: false
  plot_fmt: png
  dt: 0.01
  x_axis: sec
  n_plot_samples: 8
  compare: true
  compare_metrics: [rmse, mae]
  fail_fast: false

common_overrides:
  run:
    device: cuda
    amp: true
    out_dir: out/ckpts/pooltest02_s1_kf_transition_balance_8gpu_v1
  data:
    data_dir: data/processed/2026-01-10_pooltest02_s1_kf_v1
    batch_size: 512
    num_workers: 4
    pin_memory: true
  train:
    epochs: 120

runs:
  - name: kf_a0_joint_nll_seed8
    label: KF joint NLL seed8
    role: baseline
    overrides:
      run:
        seed: 8
        variant: KF_A0_joint_nll_seed8
      model:
        head_mode: joint
      loss:
        type: nll_diag
        state_huber_weight: 0.0
        state_huber_delta: 1.0
        delta_huber_weight: 0.0
        delta_huber_delta: 1.0
        logvar_reg_weight: 0.0
        tail_weight_power: 0.0
        acc_weight: 1.0
        gyro_weight: 1.0
        vel_weight: 1.0
        dvl_obs_weight: 0.0

  - name: kf_a0_joint_nll_seed9
    label: KF joint NLL seed9
    role: baseline
    overrides:
      run:
        seed: 9
        variant: KF_A0_joint_nll_seed9
      model:
        head_mode: joint
      loss:
        type: nll_diag
        state_huber_weight: 0.0
        state_huber_delta: 1.0
        delta_huber_weight: 0.0
        delta_huber_delta: 1.0
        logvar_reg_weight: 0.0
        tail_weight_power: 0.0
        acc_weight: 1.0
        gyro_weight: 1.0
        vel_weight: 1.0
        dvl_obs_weight: 0.0

  - name: kf_b0_grouped_tb_seed8
    label: KF grouped TB seed8
    role: primary
    overrides:
      run:
        seed: 8
        variant: KF_B0_grouped_tb_seed8

  - name: kf_b0_grouped_tb_seed9
    label: KF grouped TB seed9
    role: primary
    overrides:
      run:
        seed: 9
        variant: KF_B0_grouped_tb_seed9

  - name: kf_b1_grouped_tb_dvlaux_seed8
    label: KF grouped TB DVLaux seed8
    role: ablation
    overrides:
      run:
        seed: 8
        variant: KF_B1_grouped_tb_dvlaux_seed8
      model:
        aux_heads:
          dvl_obs:
            enabled: true
            hidden: 96
      loss:
        dvl_obs_weight: 0.2
        dvl_obs_delta: 1.0

  - name: kf_b1_grouped_tb_dvlaux_seed9
    label: KF grouped TB DVLaux seed9
    role: ablation
    overrides:
      run:
        seed: 9
        variant: KF_B1_grouped_tb_dvlaux_seed9
      model:
        aux_heads:
          dvl_obs:
            enabled: true
            hidden: 96
      loss:
        dvl_obs_weight: 0.2
        dvl_obs_delta: 1.0

  - name: kf_b4_grouped_tb_thruster_hydro_seed8
    label: KF grouped TB B4 seed8
    role: primary
    overrides:
      run:
        seed: 8
        variant: KF_B4_grouped_tb_thruster_hydro_seed8
      model:
        blocks:
          thruster_lag:
            enabled: true
          hydro_ssm:
            enabled: true

  - name: kf_b4_grouped_tb_thruster_hydro_seed9
    label: KF grouped TB B4 seed9
    role: primary
    overrides:
      run:
        seed: 9
        variant: KF_B4_grouped_tb_thruster_hydro_seed9
      model:
        blocks:
          thruster_lag:
            enabled: true
          hydro_ssm:
            enabled: true
