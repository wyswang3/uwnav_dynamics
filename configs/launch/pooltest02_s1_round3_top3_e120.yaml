# Round 3 single-source matrix:
# - this file is the only maintained config source for round3
# - use round2_struct40 results to narrow the structure search to
#   B0 baseline / U1 ablation / B4+U1 primary
# - drop B4 because its 2-seed family average is worse than U1 on
#   rmse_global / mae_global / rmse_global_masked / mae_global_masked
# - restore the training budget to 120 epochs
# - add one conservative B4+U1 training-parameter branch to test whether
#   lower lr + stronger wd + small dropout improves long-run generalization

base_train_yaml: configs/train/pooltest02_s1_lstm_v0.yaml

launcher:
  work_dir: out/train_matrix/pooltest02_s1_round3_top3_e120
  gpus: [0, 1, 2, 3, 4, 5, 6, 7]
  max_parallel: 8
  run_eval: true
  eval_split: test
  eval_device: cuda
  eval_batch_size: 1024
  plots: false
  plot_fmt: png
  dt: 0.01
  x_axis: sec
  n_plot_samples: 8
  compare: true
  compare_metrics: [rmse, mae]
  fail_fast: false

common_overrides:
  run:
    device: cuda
    amp: true
    out_dir: out/ckpts/pooltest02_s1_round3_top3_e120
  data:
    data_dir: data/processed/2026-01-10_pooltest02_s1
    batch_size: 512
    num_workers: 4
    pin_memory: true
  train:
    epochs: 120

runs:
  - name: b0_seed0
    label: B0 baseline seed0
    role: baseline
    overrides:
      run:
        seed: 0
        variant: B0_baseline_seed0_e120

  - name: b0_seed1
    label: B0 baseline seed1
    role: baseline
    overrides:
      run:
        seed: 1
        variant: B0_baseline_seed1_e120

  - name: u1_seed0
    label: U1 uncertainty seed0
    role: ablation
    overrides:
      run:
        seed: 0
        variant: U1_uncertainty_seed0_e120
      model:
        blocks:
          uncertainty:
            enabled: true

  - name: u1_seed1
    label: U1 uncertainty seed1
    role: ablation
    overrides:
      run:
        seed: 1
        variant: U1_uncertainty_seed1_e120
      model:
        blocks:
          uncertainty:
            enabled: true

  - name: b4u1_default_seed0
    label: B4+U1 default seed0
    role: primary
    overrides:
      run:
        seed: 0
        variant: B4U1_thruster_hydro_uncertainty_seed0_e120
      model:
        blocks:
          thruster_lag:
            enabled: true
          hydro_ssm:
            enabled: true
          uncertainty:
            enabled: true

  - name: b4u1_default_seed1
    label: B4+U1 default seed1
    role: primary
    overrides:
      run:
        seed: 1
        variant: B4U1_thruster_hydro_uncertainty_seed1_e120
      model:
        blocks:
          thruster_lag:
            enabled: true
          hydro_ssm:
            enabled: true
          uncertainty:
            enabled: true

  - name: b4u1_tuned_seed0
    label: B4+U1 tuned seed0
    role: primary
    overrides:
      run:
        seed: 0
        variant: B4U1_thruster_hydro_uncertainty_tuned_seed0_e120
      model:
        dropout: 0.1
        blocks:
          thruster_lag:
            enabled: true
          hydro_ssm:
            enabled: true
          uncertainty:
            enabled: true
      optim:
        lr: 5.0e-4
        weight_decay: 3.0e-4

  - name: b4u1_tuned_seed1
    label: B4+U1 tuned seed1
    role: primary
    overrides:
      run:
        seed: 1
        variant: B4U1_thruster_hydro_uncertainty_tuned_seed1_e120
      model:
        dropout: 0.1
        blocks:
          thruster_lag:
            enabled: true
          hydro_ssm:
            enabled: true
          uncertainty:
            enabled: true
      optim:
        lr: 5.0e-4
        weight_decay: 3.0e-4
