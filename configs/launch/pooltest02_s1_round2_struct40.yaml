# Round 2 matrix:
# - keep the backbone fixed
# - compare Base / Dyn / Unc / DynUnc
# - use two seeds for each branch
# - shorten training to 40 epochs to reduce overfitting risk

base_train_yaml: configs/train/pooltest02_s1_lstm_v0.yaml

launcher:
  work_dir: out/train_matrix/pooltest02_s1_round2_struct40
  gpus: [0, 1, 2, 3, 4, 5, 6, 7]
  max_parallel: 8
  run_eval: true
  eval_split: test
  eval_device: cuda
  eval_batch_size: 1024
  plots: false
  plot_fmt: png
  dt: 0.01
  x_axis: sec
  n_plot_samples: 8
  compare: true
  compare_metrics: [rmse, mae]
  fail_fast: false

common_overrides:
  run:
    device: cuda
    amp: true
    out_dir: out/ckpts/pooltest02_s1_round2_struct40
  data:
    data_dir: data/processed/2026-01-10_pooltest02_s1
    batch_size: 512
    num_workers: 4
    pin_memory: true
  train:
    epochs: 40

runs:
  - name: b0_seed0
    label: Base s0
    role: baseline
    overrides:
      run:
        seed: 0
        variant: B0_baseline_seed0_e40

  - name: b0_seed1
    label: Base s1
    role: baseline
    overrides:
      run:
        seed: 1
        variant: B0_baseline_seed1_e40

  - name: b4_seed0
    label: Dyn s0
    role: primary
    overrides:
      run:
        seed: 0
        variant: B4_thruster_hydro_seed0_e40
      model:
        blocks:
          thruster_lag:
            enabled: true
          hydro_ssm:
            enabled: true

  - name: b4_seed1
    label: Dyn s1
    role: primary
    overrides:
      run:
        seed: 1
        variant: B4_thruster_hydro_seed1_e40
      model:
        blocks:
          thruster_lag:
            enabled: true
          hydro_ssm:
            enabled: true

  - name: u1_seed0
    label: Unc s0
    role: primary
    overrides:
      run:
        seed: 0
        variant: U1_uncertainty_seed0_e40
      model:
        blocks:
          uncertainty:
            enabled: true

  - name: u1_seed1
    label: Unc s1
    role: primary
    overrides:
      run:
        seed: 1
        variant: U1_uncertainty_seed1_e40
      model:
        blocks:
          uncertainty:
            enabled: true

  - name: b4u1_seed0
    label: DynUnc s0
    role: primary
    overrides:
      run:
        seed: 0
        variant: B4U1_thruster_hydro_uncertainty_seed0_e40
      model:
        blocks:
          thruster_lag:
            enabled: true
          hydro_ssm:
            enabled: true
          uncertainty:
            enabled: true

  - name: b4u1_seed1
    label: DynUnc s1
    role: primary
    overrides:
      run:
        seed: 1
        variant: B4U1_thruster_hydro_uncertainty_seed1_e40
      model:
        blocks:
          thruster_lag:
            enabled: true
          hydro_ssm:
            enabled: true
          uncertainty:
            enabled: true
