# 2026-04-11 当前推荐 7 GPU 单步状态转移矩阵：
# - 仅使用第 1 到第 7 张卡；若服务器按 0-based CUDA 编号暴露，则对应 [0..6]
# - 保留 8 个候选，第 8 个任务排队执行，以维持 solver 候选的完整筛选面
# - 该批次是当前默认的状态转移求解器主筛选链

base_train_yaml: configs/train/pooltest02_s1_kf_ctx_quality_step_transition_v1.yaml

launcher:
  work_dir: out/train_matrix/pooltest02_s1_kf_quality_step_7gpu_v2
  gpus: [0, 1, 2, 3, 4, 5, 6]
  max_parallel: 7
  run_eval: true
  eval_split: test
  eval_device: cuda
  eval_batch_size: 2048
  plots: true
  plot_fmt: png
  dt: 0.01
  x_axis: sec
  n_plot_samples: 8
  compare: true
  compare_metrics: [rmse, mae]
  fail_fast: false

common_overrides:
  run:
    device: cuda
    amp: true
    out_dir: out/ckpts/pooltest02_s1_kf_quality_step_7gpu_v2
  data:
    data_dir: data/processed/2026-01-10_pooltest02_s1_kf_ctx_quality_step_v1
    batch_size: 1024
    num_workers: 4
    pin_memory: true
  train:
    epochs: 120

runs:
  - name: step_a0_joint_nll_seed8
    label: StepNLL s8
    role: baseline
    overrides:
      run:
        seed: 8
        variant: STEP_A0_joint_nll_seed8
      model:
        head_mode: joint
      loss:
        type: nll_diag
        state_huber_weight: 0.0
        state_huber_delta: 1.0
        delta_huber_weight: 0.0
        delta_huber_delta: 1.0
        logvar_reg_weight: 0.0
        tail_weight_power: 0.0
        acc_weight: 1.0
        gyro_weight: 1.0
        vel_weight: 1.0
        dvl_obs_weight: 0.0

  - name: step_a0_joint_nll_seed9
    label: StepNLL s9
    role: baseline
    overrides:
      run:
        seed: 9
        variant: STEP_A0_joint_nll_seed9
      model:
        head_mode: joint
      loss:
        type: nll_diag
        state_huber_weight: 0.0
        state_huber_delta: 1.0
        delta_huber_weight: 0.0
        delta_huber_delta: 1.0
        logvar_reg_weight: 0.0
        tail_weight_power: 0.0
        acc_weight: 1.0
        gyro_weight: 1.0
        vel_weight: 1.0
        dvl_obs_weight: 0.0

  - name: step_b0_grouped_tb_seed8
    label: StepBase s8
    role: primary
    overrides:
      run:
        seed: 8
        variant: STEP_B0_grouped_tb_seed8

  - name: step_b0_grouped_tb_seed9
    label: StepBase s9
    role: primary
    overrides:
      run:
        seed: 9
        variant: STEP_B0_grouped_tb_seed9

  - name: step_b2_grouped_tb_strong_delta_seed8
    label: StepDelta s8
    role: ablation
    overrides:
      run:
        seed: 8
        variant: STEP_B2_grouped_tb_strong_delta_seed8
      loss:
        delta_huber_weight: 1.4
        acc_weight: 3.2
        gyro_weight: 2.1
        vel_weight: 2.3

  - name: step_b2_grouped_tb_strong_delta_seed9
    label: StepDelta s9
    role: ablation
    overrides:
      run:
        seed: 9
        variant: STEP_B2_grouped_tb_strong_delta_seed9
      loss:
        delta_huber_weight: 1.4
        acc_weight: 3.2
        gyro_weight: 2.1
        vel_weight: 2.3

  - name: step_b4_grouped_tb_blocks_seed8
    label: StepDyn s8
    role: primary
    overrides:
      run:
        seed: 8
        variant: STEP_B4_grouped_tb_blocks_seed8
      model:
        blocks:
          thruster_lag:
            enabled: true
          hydro_ssm:
            enabled: true

  - name: step_b4_grouped_tb_blocks_seed9
    label: StepDyn s9
    role: primary
    overrides:
      run:
        seed: 9
        variant: STEP_B4_grouped_tb_blocks_seed9
      model:
        blocks:
          thruster_lag:
            enabled: true
          hydro_ssm:
            enabled: true
