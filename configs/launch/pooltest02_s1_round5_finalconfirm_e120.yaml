# Round 5 single-source matrix:
# - keep the round4 narrowed candidate set; do not reopen broad architecture search
# - use new seeds 6~9 to confirm whether Unc or DynUnc is the more reliable final candidate
# - keep the training budget and data path unchanged to preserve cross-round comparability
# - use masked metrics + control_readiness as the final offline screening signal

base_train_yaml: configs/train/pooltest02_s1_lstm_v0.yaml

launcher:
  work_dir: out/train_matrix/pooltest02_s1_round5_finalconfirm_e120
  gpus: [0, 1, 2, 3, 4, 5, 6, 7]
  max_parallel: 8
  run_eval: true
  eval_split: test
  eval_device: cuda
  eval_batch_size: 1024
  plots: true
  plot_fmt: png
  dt: 0.01
  x_axis: sec
  n_plot_samples: 8
  compare: true
  compare_metrics: [rmse, mae]
  fail_fast: false

common_overrides:
  run:
    device: cuda
    amp: true
    out_dir: out/ckpts/pooltest02_s1_round5_finalconfirm_e120
  data:
    data_dir: data/processed/2026-01-10_pooltest02_s1
    batch_size: 512
    num_workers: 4
    pin_memory: true
  loss:
    type: transition_balance
    state_mse_weight: 0.2
    state_huber_weight: 0.9
    state_huber_delta: 1.0
    state_final_weight: 0.7
    late_horizon_weight: 0.3
    late_horizon_fraction: 0.4
    delta_huber_weight: 0.45
    delta_huber_delta: 1.0
    logvar_reg_weight: 0.02
    tail_weight_power: 1.2
    acc_weight: 2.5
    gyro_weight: 1.6
    vel_weight: 1.8
  train:
    epochs: 120
    metric: val_transition_score

runs:
  - name: u1_seed6
    label: Unc s6
    role: ablation
    overrides:
      run:
        seed: 6
        variant: U1_uncertainty_seed6_e120
      model:
        blocks:
          uncertainty:
            enabled: true

  - name: u1_seed7
    label: Unc s7
    role: ablation
    overrides:
      run:
        seed: 7
        variant: U1_uncertainty_seed7_e120
      model:
        blocks:
          uncertainty:
            enabled: true

  - name: u1_seed8
    label: Unc s8
    role: ablation
    overrides:
      run:
        seed: 8
        variant: U1_uncertainty_seed8_e120
      model:
        blocks:
          uncertainty:
            enabled: true

  - name: u1_seed9
    label: Unc s9
    role: ablation
    overrides:
      run:
        seed: 9
        variant: U1_uncertainty_seed9_e120
      model:
        blocks:
          uncertainty:
            enabled: true

  - name: b4u1_seed6
    label: DynUnc s6
    role: primary
    overrides:
      run:
        seed: 6
        variant: B4U1_thruster_hydro_uncertainty_seed6_e120
      model:
        blocks:
          thruster_lag:
            enabled: true
          hydro_ssm:
            enabled: true
          uncertainty:
            enabled: true

  - name: b4u1_seed7
    label: DynUnc s7
    role: primary
    overrides:
      run:
        seed: 7
        variant: B4U1_thruster_hydro_uncertainty_seed7_e120
      model:
        blocks:
          thruster_lag:
            enabled: true
          hydro_ssm:
            enabled: true
          uncertainty:
            enabled: true

  - name: b4u1_seed8
    label: DynUnc s8
    role: primary
    overrides:
      run:
        seed: 8
        variant: B4U1_thruster_hydro_uncertainty_seed8_e120
      model:
        blocks:
          thruster_lag:
            enabled: true
          hydro_ssm:
            enabled: true
          uncertainty:
            enabled: true

  - name: b4u1_seed9
    label: DynUnc s9
    role: primary
    overrides:
      run:
        seed: 9
        variant: B4U1_thruster_hydro_uncertainty_seed9_e120
      model:
        blocks:
          thruster_lag:
            enabled: true
          hydro_ssm:
            enabled: true
          uncertainty:
            enabled: true
