# Round 5 single-source matrix:
# - keep the round4 narrowed candidate set; do not reopen broad architecture search
# - use new seeds 6~9 to confirm whether U1 or B4+U1 is the more reliable final candidate
# - keep the training budget and data path unchanged to preserve cross-round comparability
# - use masked metrics + control_readiness as the final offline screening signal

base_train_yaml: configs/train/pooltest02_s1_lstm_v0.yaml

launcher:
  work_dir: out/train_matrix/pooltest02_s1_round5_finalconfirm_e120
  gpus: [0, 1, 2, 3, 4, 5, 6, 7]
  max_parallel: 8
  run_eval: true
  eval_split: test
  eval_device: cuda
  eval_batch_size: 1024
  plots: false
  plot_fmt: png
  dt: 0.01
  x_axis: sec
  n_plot_samples: 8
  compare: true
  compare_metrics: [rmse, mae]
  fail_fast: false

common_overrides:
  run:
    device: cuda
    amp: true
    out_dir: out/ckpts/pooltest02_s1_round5_finalconfirm_e120
  data:
    data_dir: data/processed/2026-01-10_pooltest02_s1
    batch_size: 512
    num_workers: 4
    pin_memory: true
  train:
    epochs: 120

runs:
  - name: u1_seed6
    label: U1 uncertainty seed6
    role: ablation
    overrides:
      run:
        seed: 6
        variant: U1_uncertainty_seed6_e120
      model:
        blocks:
          uncertainty:
            enabled: true

  - name: u1_seed7
    label: U1 uncertainty seed7
    role: ablation
    overrides:
      run:
        seed: 7
        variant: U1_uncertainty_seed7_e120
      model:
        blocks:
          uncertainty:
            enabled: true

  - name: u1_seed8
    label: U1 uncertainty seed8
    role: ablation
    overrides:
      run:
        seed: 8
        variant: U1_uncertainty_seed8_e120
      model:
        blocks:
          uncertainty:
            enabled: true

  - name: u1_seed9
    label: U1 uncertainty seed9
    role: ablation
    overrides:
      run:
        seed: 9
        variant: U1_uncertainty_seed9_e120
      model:
        blocks:
          uncertainty:
            enabled: true

  - name: b4u1_seed6
    label: B4+U1 final-confirm seed6
    role: primary
    overrides:
      run:
        seed: 6
        variant: B4U1_thruster_hydro_uncertainty_seed6_e120
      model:
        blocks:
          thruster_lag:
            enabled: true
          hydro_ssm:
            enabled: true
          uncertainty:
            enabled: true

  - name: b4u1_seed7
    label: B4+U1 final-confirm seed7
    role: primary
    overrides:
      run:
        seed: 7
        variant: B4U1_thruster_hydro_uncertainty_seed7_e120
      model:
        blocks:
          thruster_lag:
            enabled: true
          hydro_ssm:
            enabled: true
          uncertainty:
            enabled: true

  - name: b4u1_seed8
    label: B4+U1 final-confirm seed8
    role: primary
    overrides:
      run:
        seed: 8
        variant: B4U1_thruster_hydro_uncertainty_seed8_e120
      model:
        blocks:
          thruster_lag:
            enabled: true
          hydro_ssm:
            enabled: true
          uncertainty:
            enabled: true

  - name: b4u1_seed9
    label: B4+U1 final-confirm seed9
    role: primary
    overrides:
      run:
        seed: 9
        variant: B4U1_thruster_hydro_uncertainty_seed9_e120
      model:
        blocks:
          thruster_lag:
            enabled: true
          hydro_ssm:
            enabled: true
          uncertainty:
            enabled: true
