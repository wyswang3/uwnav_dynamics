dataset:
  name: "2026-01-10_pooltest02_s1_smoke"

  base_table:
    csv: "out/train/2026-01-10_pooltest02_train_base_smoke.csv"
    time_col: "t_s"

  sliding_window:
    hist_len: 100
    pred_len: 10
    stride: 1

    input_cols:
      - ch1_cmd
      - ch2_cmd
      - ch3_cmd
      - ch4_cmd
      - ch5_cmd
      - ch6_cmd
      - ch7_cmd
      - ch8_cmd
      - AccX_body_mps2
      - AccY_body_mps2
      - AccZ_body_mps2
      - GyroX_body_rad_s
      - GyroY_body_rad_s
      - GyroZ_body_rad_s
      - VelX_state_mps
      - VelY_state_mps
      - VelZ_state_mps
      - P0_W
      - P1_W
      - P2_W
      - P3_W
      - P4_W
      - P5_W
      - P6_W
      - P7_W

    target_cols:
      - AccX_body_mps2
      - AccY_body_mps2
      - AccZ_body_mps2
      - GyroX_body_rad_s
      - GyroY_body_rad_s
      - GyroZ_body_rad_s
      - VelX_state_mps
      - VelY_state_mps
      - VelZ_state_mps

    valid_mask_col: null
    min_valid_ratio: 1.0
    drop_incomplete: true

  output:
    dir: "data/processed/2026-01-10_pooltest02_s1_smoke"
    normalize: "standard"
