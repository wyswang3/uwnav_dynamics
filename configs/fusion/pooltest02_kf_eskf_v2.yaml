fusion:
  base_csv: "out/train/2026-01-10_pooltest02_train_base.csv"
  imu_proc_csv: "out/imu_proc/min_imu_tb_20260110_193348_proc.csv"
  out_csv: "out/train/2026-01-10_pooltest02_train_base_kf_v2.csv"

  mode: "eskf"
  default_dt_s: 0.01
  min_dt_s: 1.0e-4
  max_dt_s: 0.05

  init_vel_from_first_dvl: true
  fill_power_with_ffill_bfill: true

  accel_lpf_alpha: 0.22
  gyro_lpf_alpha: 0.18
  attitude_blend: 0.10
  vel_accel_blend: 0.75

  process_noise_vel: 0.20
  process_noise_att: 0.05
  meas_noise_dvl: [0.03, 0.03, 0.04]
  meas_noise_att: [0.02, 0.02, 0.04]

  bias_correction_gain_acc: 0.015
  bias_correction_gain_gyro: 0.020
  innovation_clip_vel_mps: 3.00
  innovation_clip_att_rad: 0.25

  vel_decay_rate: 1.20
  max_abs_dvl_speed_mps: 0.75
  max_dvl_speed_jump_mps: 0.45
  max_abs_speed_mps: 3.0
  max_abs_acc_proxy_mps2: 4.0
  max_abs_gyro_proxy_rad_s: 1.0
  max_abs_bias_acc_mps2: 2.5
  max_abs_bias_gyro_rad_s: 1.0
  max_dt_since_dvl_s: 1.0
  min_var: 1.0e-6
